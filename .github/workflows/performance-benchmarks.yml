name: Performance Benchmarks

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '0 4 * * 0'   # Domingos a las 04:00 UTC (semanal)
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  # ── Benchmarks ─────────────────────────────────────────────────────────────
  benchmarks:
    name: Run Performance Benchmarks
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore SistemaVentas.Benchmarks/SistemaVentas.Benchmarks.csproj /p:EnableWindowsTargeting=true

      - name: Build benchmarks
        run: |
          dotnet build SistemaVentas.Benchmarks/SistemaVentas.Benchmarks.csproj `
            --configuration Release `
            --no-restore `
            /p:EnableWindowsTargeting=true

      - name: Run benchmarks
        run: |
          dotnet run `
            --project SistemaVentas.Benchmarks/SistemaVentas.Benchmarks.csproj `
            --configuration Release `
            /p:EnableWindowsTargeting=true `
            -- --exporters json --filter '*'
        timeout-minutes: 30

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results-${{ github.run_number }}
          path: BenchmarkDotNet.Artifacts/
          retention-days: 30

      - name: Comment benchmark results on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const resultsDir = 'BenchmarkDotNet.Artifacts/results';
            if (!fs.existsSync(resultsDir)) {
              console.log('No benchmark results found.');
              return;
            }

            const files = fs.readdirSync(resultsDir).filter(f => f.endsWith('-report-github.md'));
            if (files.length === 0) return;

            const content = files.map(f =>
              fs.readFileSync(path.join(resultsDir, f), 'utf8')
            ).join('\n\n');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 📊 Benchmark Results\n\n${content}`
            });
