name: Code Analysis

on:
  push:
    branches: [ "main", "feature/**" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 6 * * 1'   # Lunes a las 06:00 UTC

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  # ── Static Analysis ────────────────────────────────────────────────────────
  static-analysis:
    name: Static Code Analysis
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: |
          dotnet restore SistemaVentas/SistemaVentas.csproj /p:EnableWindowsTargeting=true
          dotnet restore SistemaVentas.API/SistemaVentas.API.csproj /p:EnableWindowsTargeting=true

      - name: Build with warnings as analysis
        run: |
          dotnet build SistemaVentas/SistemaVentas.csproj `
            --configuration Release `
            --no-restore `
            /p:EnableWindowsTargeting=true `
            /p:TreatWarningsAsErrors=false `
            /p:WarningLevel=5

          dotnet build SistemaVentas.API/SistemaVentas.API.csproj `
            --configuration Release `
            --no-restore `
            /p:EnableWindowsTargeting=true `
            /p:TreatWarningsAsErrors=false `
            /p:WarningLevel=5

      - name: Check for vulnerable packages
        run: |
          dotnet list SistemaVentas/SistemaVentas.csproj package --vulnerable --include-transitive
          dotnet list SistemaVentas.API/SistemaVentas.API.csproj package --vulnerable --include-transitive
          dotnet list SistemaVentas.Tests/SistemaVentas.Tests.csproj package --vulnerable --include-transitive

  # ── Dependency Review ──────────────────────────────────────────────────────
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
