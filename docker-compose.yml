version: '3.8'

services:
  # ── API REST ───────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: final
    container_name: sistemaventas-api
    ports:
      - "5000:80"
      - "5001:443"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
      - Database__ConnectionString=Data Source=/data/SistemaVentas.db;Journal Mode=WAL;Cache Size=-50000;
      - Security__JwtSecretKey=${JWT_SECRET_KEY}
      - Security__EncryptionKeyBase64=${ENCRYPTION_KEY}
      - Monitoring__ApplicationInsightsConnectionString=${APP_INSIGHTS_CONNECTION}
      - Api__EnableSwagger=false
      - Api__EnableRateLimiting=true
    volumes:
      - db_data:/data
      - backup_data:/backups
      - api_logs:/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      - redis

  # ── Redis Cache ────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: sistemaventas-redis
    ports:
      - "6379:6379"
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── Nginx (Reverse Proxy) ──────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: sistemaventas-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - api
    restart: unless-stopped

volumes:
  db_data:
    driver: local
  backup_data:
    driver: local
  api_logs:
    driver: local
  redis_data:
    driver: local
  nginx_logs:
    driver: local

# ── Perfil de desarrollo ───────────────────────────────────────────────────
# Usar: docker-compose --profile dev up
# Omite nginx y usa configuración de desarrollo
