apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sistema-ventas-ingress
  namespace: sistema-ventas
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  tls:
  - hosts:
    - api.sistemaventas.app
    secretName: sistema-ventas-tls
  rules:
  - host: api.sistemaventas.app
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: sistema-ventas-api
            port:
              number: 80
